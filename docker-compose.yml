version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Services
  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - session-service
      - match-service
      - recommendation-service

  session-service:
    build: ./services/session_service
    # ports:
    #   - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/app_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  match-service:
    build: ./services/match_service
    # ports:
    #   - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SERVICE_URL=http://gateway:80
      - REC_SERVICE_URL=http://gateway:80
    depends_on:
      redis:
        condition: service_healthy
      session-service:
        condition: service_started

  recommendation-service:
    build: ./services/recommendation
    # ports:
    #   - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/app_db
      - SESSION_SERVICE_URL=http://gateway:80
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
